<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTCT</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #14181f; color: #e6e6e6;
        font-family: 'Poppins', 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      .card { width: 340px; text-align: center; padding: 28px; }
      .logo { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
      .sub { margin-top: 4px; font-size: 12px; color: #8b93a1; }
      .spinner {
        width: 34px; height: 34px; margin: 22px auto 14px;
        border: 3px solid rgba(255,255,255,.14); border-top-color: #f59e0b;
        border-radius: 50%; animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .status { font-size: 12px; color: #b6bdc9; min-height: 16px; }
      .error { color: #f87171; }
      .btn {
        margin-top: 16px; width: 100%; padding: 9px 12px; cursor: pointer;
        border: 1px solid #f59e0b; background: #f59e0b; color: #1b2636;
        border-radius: 8px; font-weight: 600; font-size: 13px;
      }
      .btn:disabled { opacity: .45; cursor: default; }
      .join { margin-top: 20px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 14px; }
      .join label { display: block; font-size: 11px; color: #8b93a1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
      .row { display: flex; gap: 6px; }
      .row input {
        flex: 1; min-width: 0; padding: 7px 9px; border-radius: 7px;
        border: 1px solid #2a3140; background: #0f131a; color: #e6e6e6; font-size: 12px;
      }
      .row input:focus { outline: none; border-color: #f59e0b; }
      .row button {
        padding: 7px 10px; border-radius: 7px; cursor: pointer;
        border: 1px solid #2a3140; background: #1a212b; color: #cfd6e2; font-size: 12px;
      }
      .hint { margin-top: 8px; font-size: 10.5px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">Been There, Conquered That</div>
      <div class="sub">pentest notes &amp; reporting</div>
      <div class="spinner" id="spinner"></div>
      <div class="status" id="status">Starting local server…</div>
      <button class="btn" id="open" disabled>Open BTCT</button>

      <div class="join">
        <label for="url">Or join another operator's server</label>
        <div class="row">
          <input id="url" type="text" inputmode="url" placeholder="http://192.168.1.20:8899" />
          <button id="connect">Connect</button>
        </div>
        <div class="hint" id="hint">Your machine also hosts, so teammates can reach you at your LAN address.</div>
      </div>
    </div>

    <script>
      // This page runs on the Wails asset origin, so it can call the Go
      // bindings AND navigate the webview. The Go shell starts the bundled
      // Bun server and reports readiness through GetState(); when ready we
      // enter the local app, unless the operator chose to join a remote one.
      const statusEl = document.getElementById('status');
      const openBtn = document.getElementById('open');
      const spinner = document.getElementById('spinner');
      const urlInput = document.getElementById('url');
      const connectBtn = document.getElementById('connect');
      const hintEl = document.getElementById('hint');

      let localUrl = '';
      let entered = false;
      let userTyping = false;

      urlInput.addEventListener('focus', () => { userTyping = true; });
      urlInput.addEventListener('input', () => { userTyping = urlInput.value.trim().length > 0; });

      function go(url) {
        if (entered) return;
        entered = true;
        window.location.href = url;
      }

      function normalize(u) {
        u = (u || '').trim();
        if (!u) return '';
        if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
        return u.replace(/\/+$/, '');
      }

      connectBtn.addEventListener('click', () => {
        const u = normalize(urlInput.value);
        if (!u) { urlInput.focus(); return; }
        go(u);
      });
      urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') connectBtn.click(); });

      openBtn.addEventListener('click', () => { if (localUrl) go(localUrl); });

      async function poll() {
        try {
          const s = await window.go.main.App.GetState();
          if (s.error) {
            spinner.style.display = 'none';
            statusEl.className = 'status error';
            statusEl.textContent = 'Could not start the local server: ' + s.error;
            return; // stop polling; the join option is still available
          }
          if (s.ready) {
            localUrl = s.localURL;
            spinner.style.display = 'none';
            statusEl.textContent = 'Ready.';
            openBtn.disabled = false;
            hintEl.textContent = 'Hosting on ' + (s.lanURL || s.localURL) + ' — teammates can join at that address.';
            // Auto-enter the local app unless the operator is entering a remote URL.
            if (!userTyping) { setTimeout(() => { if (!userTyping) go(localUrl); }, 700); }
            return;
          }
          statusEl.textContent = s.message || 'Starting local server…';
        } catch (e) {
          // Bindings not ready yet on the very first ticks; keep polling.
        }
        setTimeout(poll, 350);
      }
      poll();
    </script>
  </body>
</html>
